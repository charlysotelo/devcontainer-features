name: "Test Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseImage:
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test copilot feature on ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f copilot -i ${{ matrix.baseImage }} .
