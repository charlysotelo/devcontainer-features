name: "Test Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.set-features.outputs.features }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            copilot:
              - 'src/copilot/**'
              - 'test/copilot/**'
            openpelo:
              - 'src/openpelo/**'
              - 'test/openpelo/**'
            talosctl:
              - 'src/talosctl/**'
              - 'test/talosctl/**'

      - name: Set features to test
        id: set-features
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'features=["copilot","openpelo","talosctl"]' >> $GITHUB_OUTPUT
          else
            echo 'features=${{ steps.filter.outputs.changes }}' >> $GITHUB_OUTPUT
          fi

  test:
    needs: changes
    if: needs.changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.changes.outputs.features) }}
        baseImage:
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }} on ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }} .


